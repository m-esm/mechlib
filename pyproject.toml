[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mechlib"
version = "0.6.0"
description = "Pure parametric geometry components for FDM-printed mechanical design (trimesh + shapely + manifold3d)"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "trimesh>=4",
    "shapely>=2",
    "manifold3d",
]
authors = [
    {name = "m-esm"},
]

[project.optional-dependencies]
dev = ["pytest"]
full = ["scipy", "matplotlib", "cadquery-ocp"]

[tool.setuptools.packages.find]
include = ["mechlib*"]
