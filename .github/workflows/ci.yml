# Turned off on 2026-11-23 (MOSA-1727). Rule of 2026-11-22: nothing runs on GitHub-hosted
# runners. This repository has no ha3 runner, so the automatic triggers are removed and the
# jobs name the ha3 labels: a manual run waits for a runner instead of using hosted minutes.
# To turn it on again: Infra Ops registers an ha3 runner for this repository, then restore
# the triggers from the commit before this one.
name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, ha3]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the backlog provenance gate resolves historic SHAs.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          # dev = pytest; full = scipy + matplotlib (text demos / mesh helpers).
          # cadquery-ocp is optional (STEP export only; tests importorskip it).
          pip install -e ".[dev]"
          pip install scipy matplotlib

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short
