# Turned off on 2026-11-23 (MOSA-1727). Rule of 2026-11-22: nothing runs on GitHub-hosted
# runners. This repository has no ha3 runner, so the automatic triggers are removed and the
# jobs name the ha3 labels: a manual run waits for a runner instead of using hosted minutes.
# To turn it on again: Infra Ops registers an ha3 runner for this repository, then restore
# the triggers from the commit before this one.
# Deploy the static gallery under docs/ to GitHub Pages.
# Replaces the flaky legacy "pages build and deployment" path, which was
# timing out / canceling under the larger docs tree (~27 MB, 130+ files).
name: Deploy Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; do not cancel an in-flight deploy (that caused the
# previous red X: two runs shared a deployment id and cancelled each other).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, ha3]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
