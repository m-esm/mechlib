<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive 3D gallery for the mechlib parametric geometry library.">
  <title>mechlib gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --field: #0b2438;
      --panel: #0f2e4a;
      --panel-deep: #092136;
      --ink: #eaf3fb;
      --muted: #8fb0cc;
      --line: rgba(148, 190, 226, 0.22);
      --line-strong: rgba(148, 190, 226, 0.5);
      --accent: #ffb454;
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --display: "Barlow Condensed", "Arial Narrow", ui-sans-serif, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--field);
      overflow-x: hidden;
    }

    body {
      min-width: 0;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        repeating-linear-gradient(0deg, rgba(148, 190, 226, 0.055) 0 1px, transparent 1px 130px),
        repeating-linear-gradient(90deg, rgba(148, 190, 226, 0.055) 0 1px, transparent 1px 130px),
        repeating-linear-gradient(0deg, rgba(148, 190, 226, 0.028) 0 1px, transparent 1px 26px),
        repeating-linear-gradient(90deg, rgba(148, 190, 226, 0.028) 0 1px, transparent 1px 26px),
        var(--field);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    #render-canvas {
      position: fixed;
      inset: 0;
      z-index: 10;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .page-shell {
      width: min(1720px, calc(100% - 36px));
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    .hero {
      margin-bottom: 34px;
      border: 1px solid var(--line-strong);
      background: rgba(9, 33, 54, 0.72);
    }

    .hero-top {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: baseline;
      justify-content: space-between;
      padding: 18px 22px 12px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(2.6rem, 6vw, 4.2rem);
      font-weight: 700;
      letter-spacing: 0.03em;
      line-height: 0.9;
      text-transform: uppercase;
    }

    .tagline {
      max-width: 760px;
      margin: 0;
      padding: 12px 22px;
      color: #c3d7ea;
      font-size: 0.95rem;
    }

    .title-block {
      display: flex;
      flex-wrap: wrap;
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 0.72rem;
    }

    .tb-cell {
      display: grid;
      gap: 2px;
      min-width: 0;
      padding: 9px 22px 10px 14px;
      border-right: 1px solid var(--line);
    }

    .tb-cell:last-child {
      flex: 1 1 auto;
      border-right: 0;
    }

    .tb-label {
      color: var(--muted);
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .tb-value {
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .repo-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--line-strong);
      color: var(--accent);
      background: transparent;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease;
    }

    .repo-link:hover,
    .repo-link:focus-visible {
      border-color: var(--accent);
      background: rgba(255, 180, 84, 0.1);
      outline: none;
    }

    .repo-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 14px;
    }

    .utility-section {
      margin-top: 44px;
      padding-top: 26px;
      border-top: 1px solid var(--line-strong);
    }

    .utility-section h2 {
      margin: 0 0 4px;
      font-family: var(--display);
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .utility-intro {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .utility-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 8px;
    }

    .utility-item {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-left: 2px solid var(--line-strong);
      background: rgba(15, 46, 74, 0.4);
    }

    .utility-item code {
      display: block;
      overflow-wrap: anywhere;
      color: #d9eafa;
      font-family: var(--mono);
      font-size: 0.7rem;
    }

    .utility-item p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .utility-item .module {
      display: block;
      margin-bottom: 4px;
    }

    .model-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      border: 1px solid var(--line);
      background: rgba(15, 46, 74, 0.55);
      transition: border-color 160ms ease;
    }

    .model-card:hover {
      border-color: var(--line-strong);
    }

    .model-card::after {
      content: "";
      position: absolute;
      inset: 0;
      --tick: rgba(186, 219, 246, 0.75);
      background:
        linear-gradient(var(--tick), var(--tick)) 0 0 / 16px 1px,
        linear-gradient(var(--tick), var(--tick)) 0 0 / 1px 16px,
        linear-gradient(var(--tick), var(--tick)) 100% 100% / 16px 1px,
        linear-gradient(var(--tick), var(--tick)) 100% 100% / 1px 16px;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    .card-heading {
      display: flex;
      gap: 10px;
      align-items: baseline;
      justify-content: space-between;
      padding: 9px 12px 2px;
      font-family: var(--mono);
    }

    .part-no {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: 0.66rem;
      letter-spacing: 0.12em;
    }

    .model-card h2 {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
      padding: 0 12px 7px;
      font-family: var(--display);
      font-size: 1.18rem;
      font-weight: 600;
      letter-spacing: 0.045em;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .module {
      flex: 0 0 auto;
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.64rem;
    }

    .viewport {
      position: relative;
      height: clamp(180px, 15vw, 230px);
      margin: 0 8px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--panel-deep);
      cursor: grab;
      touch-action: none;
    }

    .viewport:active {
      cursor: grabbing;
    }

    .load-status {
      position: absolute;
      inset: 0;
      z-index: 12;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--muted);
      background: var(--panel-deep);
      font-family: var(--mono);
      font-size: 0.72rem;
      text-align: center;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .load-status.hidden {
      opacity: 0;
    }

    .card-copy {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px 12px;
    }

    .signature {
      max-width: 100%;
      margin: 0;
      padding: 7px 9px;
      overflow-wrap: anywhere;
      border: 1px solid var(--line);
      border-left: 2px solid var(--accent);
      color: #d9eafa;
      background: rgba(6, 24, 40, 0.65);
      font-family: var(--mono);
      font-size: 0.68rem;
      line-height: 1.55;
    }

    .description,
    .origin {
      margin: 0;
    }

    .description {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      color: #c3d7ea;
      font-size: 0.84rem;
    }

    .origin {
      margin-top: auto;
      padding-top: 4px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.66rem;
    }

    .fatal-error {
      grid-column: 1 / -1;
      padding: 24px;
      border: 1px solid #a2564e;
      color: #ffd9d2;
      background: #33201c;
      font-family: var(--mono);
      font-size: 0.8rem;
    }

    @media (max-width: 700px) {
      .page-shell {
        width: min(100% - 22px, 540px);
        padding: 38px 0 52px;
      }

      .hero {
        margin-bottom: 26px;
      }

      .tb-cell {
        padding: 8px 14px 9px 12px;
      }

      .gallery-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 17px;
      }

      .utility-list {
        grid-template-columns: minmax(0, 1fr);
      }

      .viewport {
        height: min(72vw, 320px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .repo-link,
      .load-status {
        transition: none;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="render-canvas" aria-hidden="true"></canvas>
  <main class="page-shell">
    <header class="hero">
      <div class="hero-top">
        <h1>mechlib</h1>
        <a class="repo-link" href="https://github.com/m-esm/mechlib">Source &#8599;</a>
      </div>
      <p class="tagline">Parametric component register: semi-primitive geometry for mechanical design and FDM printing.</p>
      <div class="title-block">
        <div class="tb-cell"><span class="tb-label">Version</span><span class="tb-value" id="version">loading</span></div>
        <div class="tb-cell"><span class="tb-label">Parts</span><span class="tb-value" id="part-count">&#8211;</span></div>
        <div class="tb-cell"><span class="tb-label">Units</span><span class="tb-value">mm</span></div>
        <div class="tb-cell"><span class="tb-label">Contract</span><span class="tb-value">explicit args only &#183; no hidden globals &#183; no project imports</span></div>
      </div>
    </header>
    <section class="gallery-grid" id="gallery" aria-label="Interactive component models"></section>
    <section class="utility-section" aria-labelledby="utility-title">
      <h2 id="utility-title">Utility API</h2>
      <p class="utility-intro">Non-visual CSG, probing, fitting, and selection helpers.</p>
      <div class="utility-list" id="utilities"></div>
    </section>
  </main>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const canvas = document.querySelector("#render-canvas");
    const gallery = document.querySelector("#gallery");
    const utilities = document.querySelector("#utilities");
    const versionLabel = document.querySelector("#version");
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    const loader = new GLTFLoader();
    const views = [];
    const clock = new THREE.Clock();

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    function makeTextElement(tag, className, text) {
      const element = document.createElement(tag);
      element.className = className;
      element.textContent = text;
      return element;
    }

    function addLights(scene) {
      const hemisphere = new THREE.HemisphereLight(0xcfeaff, 0x283344, 2.8);
      const key = new THREE.DirectionalLight(0xffffff, 4.2);
      const fill = new THREE.DirectionalLight(0x8fc9ff, 2.0);
      key.position.set(5, -4, 8);
      fill.position.set(-5, 3, 2);
      scene.add(hemisphere, key, fill);
    }

    function prepareMaterials(root) {
      root.traverse((object) => {
        if (!object.isMesh) return;
        object.geometry.computeVertexNormals();
        const materials = Array.isArray(object.material) ? object.material : [object.material];
        for (const material of materials) {
          if (!material) continue;
          if ("metalness" in material) material.metalness = 0.1;
          if ("roughness" in material) material.roughness = 0.8;
          material.vertexColors = Boolean(object.geometry.getAttribute("color"));
          material.needsUpdate = true;
        }
      });
    }

    function frameModel(view, root) {
      const bounds = new THREE.Box3().setFromObject(root);
      const sphere = bounds.getBoundingSphere(new THREE.Sphere());
      const radius = Math.max(sphere.radius, 0.1);
      const halfFov = THREE.MathUtils.degToRad(view.camera.fov * 0.5);
      const distance = (radius / Math.sin(halfFov)) * 1.12;
      const direction = new THREE.Vector3(1.25, -1.5, 1.0).normalize();

      view.camera.near = Math.max(radius / 100, 0.01);
      view.camera.far = Math.max(radius * 100, 100);
      view.camera.position.copy(sphere.center).addScaledVector(direction, distance);
      view.camera.updateProjectionMatrix();
      view.controls.target.copy(sphere.center);
      view.controls.minDistance = radius * 0.55;
      view.controls.maxDistance = radius * 12;
      view.controls.update();
    }

    function loadView(view) {
      if (view.started) return;
      view.started = true;
      view.status.textContent = "loading model";
      loader.load(
        `./models/${view.model.file}`,
        (gltf) => {
          prepareMaterials(gltf.scene);
          view.scene.add(gltf.scene);
          frameModel(view, gltf.scene);
          view.loaded = true;
          view.status.classList.add("hidden");
          window.setTimeout(() => view.status.remove(), 250);
        },
        undefined,
        () => {
          view.status.textContent = "model could not be loaded";
        }
      );
    }

    const moduleCounters = new Map();

    function partNumber(module) {
      const key = (module || "misc").split(".").pop().toUpperCase();
      const index = (moduleCounters.get(key) || 0) + 1;
      moduleCounters.set(key, index);
      return `${key}·${String(index).padStart(2, "0")}`;
    }

    function createCard(model) {
      const card = document.createElement("article");
      card.className = "model-card";

      const heading = document.createElement("div");
      heading.className = "card-heading";
      heading.append(
        makeTextElement("span", "part-no", partNumber(model.module)),
        makeTextElement("span", "module", model.module)
      );
      const title = makeTextElement("h2", "", model.name);

      const viewport = document.createElement("div");
      viewport.className = "viewport";
      viewport.setAttribute("role", "img");
      viewport.setAttribute("aria-label", `Interactive 3D model of ${model.name}`);
      const status = makeTextElement("span", "load-status", "waiting to load");
      viewport.append(status);

      const copy = document.createElement("div");
      copy.className = "card-copy";
      copy.append(
        makeTextElement("code", "signature", model.signature),
        makeTextElement("p", "description", model.description),
        makeTextElement("p", "origin", model.origin)
      );
      card.append(heading, title, viewport, copy);
      gallery.append(card);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x092136);
      addLights(scene);
      const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 1000);
      camera.up.set(0, 0, 1);
      const controls = new OrbitControls(camera, viewport);
      controls.enableDamping = true;
      controls.dampingFactor = 0.07;
      controls.enablePan = false;
      controls.autoRotate = false;
      controls.autoRotateSpeed = 0.65;

      const view = {
        model,
        viewport,
        status,
        scene,
        camera,
        controls,
        started: false,
        loaded: false,
        visible: false,
        interacting: false,
        lastInteraction: -Infinity
      };
      controls.addEventListener("start", () => {
        view.interacting = true;
        view.lastInteraction = performance.now();
      });
      controls.addEventListener("end", () => {
        view.interacting = false;
        view.lastInteraction = performance.now();
      });
      viewport.addEventListener("pointerdown", () => {
        view.interacting = true;
        view.lastInteraction = performance.now();
      });
      const finishPointer = () => {
        view.interacting = false;
        view.lastInteraction = performance.now();
      };
      viewport.addEventListener("pointerup", finishPointer);
      viewport.addEventListener("pointercancel", finishPointer);
      viewport.addEventListener("wheel", () => {
        view.lastInteraction = performance.now();
      }, { passive: true });
      views.push(view);
      return view;
    }

    function createUtility(item) {
      const card = document.createElement("article");
      card.className = "utility-item";
      card.append(
        makeTextElement("span", "module", item.module),
        makeTextElement("code", "", item.signature),
        makeTextElement("p", "", item.description)
      );
      utilities.append(card);
    }

    const observer = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        const view = views.find((candidate) => candidate.viewport === entry.target);
        if (!view) continue;
        view.visible = entry.isIntersecting;
        if (view.visible) loadView(view);
      }
    }, { rootMargin: "240px 0px" });

    function resizeRenderer() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const pixelRatio = renderer.getPixelRatio();
      const expectedWidth = Math.floor(width * pixelRatio);
      const expectedHeight = Math.floor(height * pixelRatio);
      if (canvas.width !== expectedWidth || canvas.height !== expectedHeight) {
        renderer.setSize(width, height, false);
      }
    }

    function render(time) {
      resizeRenderer();
      const delta = Math.min(clock.getDelta(), 0.1);
      renderer.setScissorTest(false);
      renderer.setClearColor(0x000000, 0);
      renderer.clear();
      renderer.setScissorTest(true);

      for (const view of views) {
        if (!view.visible || !view.loaded) continue;
        const rect = view.viewport.getBoundingClientRect();
        if (rect.bottom <= 0 || rect.top >= window.innerHeight || rect.right <= 0 || rect.left >= window.innerWidth) {
          continue;
        }

        const left = Math.max(0, rect.left);
        const right = Math.min(window.innerWidth, rect.right);
        const top = Math.max(0, rect.top);
        const bottom = Math.min(window.innerHeight, rect.bottom);
        const width = Math.max(1, right - left);
        const height = Math.max(1, bottom - top);
        const viewportBottom = window.innerHeight - bottom;

        view.camera.aspect = rect.width / rect.height;
        view.camera.updateProjectionMatrix();
        const idle = time - view.lastInteraction > 3500;
        view.controls.autoRotate = !prefersReducedMotion.matches && !view.interacting && idle;
        view.controls.update(delta);

        renderer.setScissor(left, viewportBottom, width, height);
        renderer.setViewport(
          rect.left,
          window.innerHeight - rect.bottom,
          rect.width,
          rect.height
        );
        renderer.render(view.scene, view.camera);
      }
      renderer.setScissorTest(false);
      requestAnimationFrame(render);
    }

    async function initialize() {
      try {
        const response = await fetch("./models/index.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`manifest request returned ${response.status}`);
        const manifest = await response.json();
        versionLabel.textContent = `v${manifest.version}`;
        document.querySelector("#part-count").textContent =
          String(manifest.models.length + (manifest.utilities || []).length);
        for (const model of manifest.models) {
          const view = createCard(model);
          observer.observe(view.viewport);
        }
        for (const item of manifest.utilities || []) createUtility(item);
      } catch (error) {
        versionLabel.textContent = "unavailable";
        gallery.append(makeTextElement("p", "fatal-error", `Gallery data could not be loaded: ${error.message}`));
      }
    }

    initialize();
    requestAnimationFrame(render);

    if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
      const watchedUrls = [
        new URL(location.pathname, location.origin).href,
        new URL("./models/index.json", location.href).href
      ];
      const modified = new Map();

      async function pollChanges() {
        try {
          const responses = await Promise.all(watchedUrls.map((url) => fetch(url, {
            method: "HEAD",
            cache: "no-store"
          })));
          for (let index = 0; index < responses.length; index += 1) {
            const value = responses[index].headers.get("Last-Modified");
            if (modified.has(watchedUrls[index]) && value && modified.get(watchedUrls[index]) !== value) {
              location.reload();
              return;
            }
            modified.set(watchedUrls[index], value);
          }
        } catch (_) {
          // A local server may be between rebuilds. The next poll retries.
        }
      }

      pollChanges();
      window.setInterval(pollChanges, 1500);
    }
  </script>
</body>
</html>
